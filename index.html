<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles/styles.css" />
        <script src="auth.js"></script>
        <script src="scripts/guard.js" defer></script>
    </head>
    <body>
        <div id="auth">
            <h1>Welcome back</h1>
            <form name="login" action="" method="POST">
                <label>Email:</label><br>
                <input type="text" name="email" /><br>
                <p id="email-alert" class="valid" ></p>
                <label>Password:</label><br>
                <input type="password" name="password" /><br>
                <button type="submit">Log In</button><br>
            </form>
            <div id="signup">Don't have an account? <a href="signup.html">Sign Up</a></div>

        </div>
            
        <script>
            const form = document.querySelector("form");
            //alert(localStorage.getItem("crm_session")[0]);

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const success = logIn(e);

                if(success) {
                    localStorage.setItem("currentPage", 1);
                    window.location.replace("../general/dashboard.html");
                }
                
            });

        </script>
    </body>
</html>
