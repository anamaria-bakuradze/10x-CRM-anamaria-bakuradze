<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="components/style.css" />
        <script src="auth.js"></script>
        <script src="components/guard.js"></script>
    </head>
    <body>
        <div id="auth">
            <h1>Create Account</h1>
            <form name="signUp" action="" method="POST">
                <label for="fullname">Full name:</label><br>
                <input type="text" name="fullname" id="fullname" /><br>
                <label for="email">Email:</label><br>
                <input type="text" name="email" id="email" /><br>
                <label for="company">Company:</label><br>
                <input type="text" name="company" id="company" placeholder="Company Name (Optional)" /><br>
                <label for="password">Password:</label><br>
                <input type="password" name="password" id="password" /><br>
                <label for="confirmPassword">Confirm Password:</label><br>
                <input type="password" name="confirmPassword" id="confirmPassword" /><br>
                
                <button id="submit" type="submit">Create Account</button><br>
                <label>Already have an account? <a href="index.html">Log In</a></label>
            </form>
        </div>

        <p id="toast" style="display: none;">Account created successfully! Please log in.</p>
    </body>

    <script>
        const form = document.querySelector("form");
        // const success = false;
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const success = signUp(e);
            
            if(success) {
                const toast = document.createElement("p");
                toast.setAttribute("id", "toast");
                toast.textContent="Account created successfully! Please log in.";
                document.body.appendChild(toast);
                // document.getElementById("toast").style.display = "block";
                setTimeout(() => {
                    window.location.replace("./index.html");
                }, 1500);
            }
        });


    </script>
</html>
