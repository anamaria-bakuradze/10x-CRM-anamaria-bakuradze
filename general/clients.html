<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./styles/styles.css" />
        <script src="./scripts/clients.js" defer></script>
        <script src="./scripts/nav.js" defer></script>
        <script src="./scripts/guard.js" defer></script>
    </head>
    <body>
        <header>
            <h1>CLIENTS</h1>
            <button id="add-btn">Add Client</button>
        </header>
        
        <div id="filter">
            <form>
                <label for="search">Search:</label>
                <input type="text" name="search">
                <select>
                    <option value="All">All</option>
                    <option value="Lead">Lead</option>
                    <option value="Contacted">Contacted</option>
                    <option value="Won">Won</option>
                    <option value="Lost">Lost</option>
                </select>
            </form>
            <div class="reset"><button onclick="reset()">Reset</button></div>
            <div class="page"></div>
        </div>

    

        <div style="position: relative;">
            <button id="left">
                <span>PREVIOUS</span>
                <span>PREVIOUS</span>
                <span>PREVIOUS</span>
                <span>PREVIOUS</span>
            </button>
            <button id="right">
                <span>NEXT</span>
                <span>NEXT</span>
                <span>NEXT</span>
                <span>NEXT</span>
                <span>NEXT</span>
            </button>
            <div id="clients_container"></div>
        </div>
    </body>
</html>
