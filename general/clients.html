<!DOCTYPE html>

<body>
    <div class="body">
        <header>

        <div id="filter">
            <form>
                <!-- <label for="search">Search:</label> -->

            <div class="reset"><button id="reset">Reset</button></div>
            <div class="page"></div>
        </div>



        <div style="position: relative;">
            <button id="left">
                <span>PREVIOUS</span>
                <!-- <span>PREVIOUS</span>
                <span>PREVIOUS</span> -->

            <button id="right">
                <!-- <span>NEXT</span>

            <div id="clients_container"></div>
